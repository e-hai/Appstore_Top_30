name: daily-appstore-top30

on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "数据日期 (YYYY-MM-DD)，留空则用今天"
        required: false
        type: string
        default: ""
      stores:
        description: "采集商店"
        required: false
        type: choice
        default: both
        options:
          - both
          - app_store
          - play

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      SNAP_DATE: ${{ inputs.date }}
      STORES: ${{ inputs.stores }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install rclone
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          if [ -z "$RCLONE_CONFIG_B64" ]; then
            echo "Google Drive not configured, skip rclone install"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Download existing database from Google Drive
        env:
          RCLONE_CONFIG: ${{ runner.temp }}/rclone.conf
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          if [ -z "$RCLONE_CONFIG_B64" ]; then
            echo "Google Drive not configured, skip download"
            exit 0
          fi
          echo "$RCLONE_CONFIG_B64" | base64 -d > "$RCLONE_CONFIG"
          chmod 600 "$RCLONE_CONFIG"
          mkdir -p data
          rclone --config "$RCLONE_CONFIG" copy "gdrive:appstore-top30/data/appstore_top30.db" data/ || true

      - name: Download existing database from R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.R2_ENDPOINT }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [ -z "$R2_BUCKET" ]; then
            echo "R2 not configured, skip download"
            exit 0
          fi
          mkdir -p data
          aws s3 cp "s3://$R2_BUCKET/appstore-top30/data/appstore_top30.db" data/appstore_top30.db || true

      - name: Run daily collection
        if: env.STORES == '' || env.STORES == 'both' || env.STORES == 'app_store'
        run: |
          DATE_ARG=""
          if [ -n "$SNAP_DATE" ]; then DATE_ARG="-d $SNAP_DATE"; fi
          python3 -m appstore_top30 run $DATE_ARG

      - name: Run Google Play collection
        continue-on-error: true
        if: env.STORES == '' || env.STORES == 'both' || env.STORES == 'play'
        run: |
          DATE_ARG=""
          if [ -n "$SNAP_DATE" ]; then DATE_ARG="-d $SNAP_DATE"; fi
          python3 -m appstore_top30 play $DATE_ARG

      - name: Generate Google Play report
        continue-on-error: true
        if: env.STORES == '' || env.STORES == 'both' || env.STORES == 'play'
        run: |
          DATE_ARG=""
          if [ -n "$SNAP_DATE" ]; then DATE_ARG="-d $SNAP_DATE"; fi
          python3 -m appstore_top30 report $DATE_ARG --store play

      - name: Upload database and reports to R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.R2_ENDPOINT }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [ -z "$R2_BUCKET" ]; then
            echo "R2 not configured, skip upload"
            exit 0
          fi
          aws s3 cp data/appstore_top30.db "s3://$R2_BUCKET/appstore-top30/data/appstore_top30.db"
          aws s3 sync reports/ "s3://$R2_BUCKET/appstore-top30/reports/" --delete

      - name: Backup to Google Drive
        env:
          RCLONE_CONFIG: ${{ runner.temp }}/rclone.conf
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          if [ -z "$RCLONE_CONFIG_B64" ]; then
            echo "Google Drive not configured, skip backup"
            exit 0
          fi
          echo "$RCLONE_CONFIG_B64" | base64 -d > "$RCLONE_CONFIG"
          chmod 600 "$RCLONE_CONFIG"
          bash scripts/backup_gdrive.sh

      - name: Upload daily report artifact
        uses: actions/upload-artifact@v5
        with:
          name: appstore-top30-report
          path: reports/
          retention-days: 30
