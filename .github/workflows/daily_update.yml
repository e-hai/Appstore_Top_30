name: Daily App Store & 20 Casual Giants Auto Update

on:
  schedule:
    # 每天 UTC 00:00 (北京时间上午 08:00) 自动触发
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持在 GitHub Actions 界面一键手动触发

jobs:
  daily-fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run daily data pipeline & 20 Casual Giants update
        run: |
          chmod +x ./run_daily.sh
          ./run_daily.sh

      - name: Commit and push updated database & logs
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/appstore_top30.db logs/daily.log || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): Auto-update daily rankings, 20 casual giants & app metadata [skip ci]"
            git push origin main
          fi
