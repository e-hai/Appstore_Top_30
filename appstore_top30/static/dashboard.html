<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App Store Top 30 数据看板</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body data-theme="light">
  <div id="loading-bar" class="loading-bar"></div>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-brand">
          <span class="brand-mark">30</span>
          <div class="sidebar-title">
            <strong>App Store Top 30</strong>
            <small>多地区 · 多榜单 · 每日数据看板</small>
          </div>
        </div>
        <button id="sidebar-toggle" class="icon-button sidebar-toggle" type="button" aria-label="收起侧边栏" title="收起侧边栏" aria-expanded="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
      </div>

      <div class="sidebar-footer">
        <label>
          <span class="footer-label">主题</span>
          <select id="theme-select">
            <option value="light">默认浅色</option>
            <option value="dark">深色</option>
          </select>
        </label>
      </div>
    </aside>

    <div class="content">
      <header class="content-header">
        <div class="toolbar">
          <label>日期
            <select id="date-select"></select>
          </label>
          <label>地区
            <select id="region-select"></select>
          </label>
          <label>国家
            <select id="country-select"></select>
          </label>
          <label>榜单
            <select id="chart-select"></select>
          </label>
          <label>大类
            <select id="category-select"></select>
          </label>
          <label>分类
            <select id="subcategory-select"></select>
          </label>
        </div>
      </header>

      <main>
        <aside class="side">
          <section class="panel">
            <div class="panel-title">数据总览</div>
            <div id="summary-grid" class="summary-grid"></div>
          </section>
          <section class="panel">
            <div class="panel-title">分类分布</div>
            <div id="distribution" class="distribution"></div>
          </section>
        </aside>

        <section class="panel table-panel">
          <div class="panel-head">
            <div>
              <div id="panel-title" class="panel-title">榜单明细</div>
              <div id="table-count" class="panel-sub"></div>
            </div>
            <div class="search-box" id="search-box">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21l-4.35-4.35M17 10.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0z"/></svg>
              <input id="search-input" type="search" placeholder="搜索应用或开发者">
            </div>
          </div>
          <div id="table-wrap" class="table-wrap">
            <table>
              <thead id="table-head"></thead>
              <tbody id="table-body"></tbody>
            </table>
            <div id="empty-state" class="empty-state hidden">暂无数据，请调整筛选条件或先运行抓取。</div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div id="trend-drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div>
        <div class="panel-title" id="trend-title">排名趋势</div>
        <div class="panel-sub" id="trend-meta"></div>
      </div>
      <button id="trend-close" class="icon-button" aria-label="关闭" title="关闭">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="drawer-body">
      <div id="trend-chart" class="trend-chart"></div>
      <p class="trend-note">数值越小排名越靠前，相同日期取最佳排名。</p>
    </div>
  </div>
  <div id="drawer-mask" class="drawer-mask hidden"></div>

  <script src="/static/app.js"></script>
</body>
</html>
